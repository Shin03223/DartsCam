<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DARTS CAMERA</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; text-align:center; padding:10px; }
  .box { position:relative; width:300px; height:300px; margin:10px auto; border:2px solid #00e5ff; overflow:hidden; background:#000; }
  video { width:300px; height:300px; object-fit:cover; }
  button { padding:12px 16px; font-size:15px; font-weight:bold; border:none; border-radius:8px; margin:5px; }
</style>
</head>
<body>
  <h3 style="color:#ffd700;">DARTS CAMERA</h3>
  <div id="msg" style="color:#80cbc4; font-weight:bold; margin:8px;">待機中</div>
  <button id="btnCam" style="background:#e91e63; color:#fff;">カメラ起動</button>
  <button id="btnTest" style="background:#ff9800; color:#000;">テスト送信</button>
  <div class="box">
    <video id="vid" autoplay playsinline muted></video>
  </div>
  <script>
    var msg = document.getElementById('msg');
    document.getElementById('btnTest').onclick = function() {
      msg.innerText = 'テスト送信実行中...';
      fetch('https://ntfy.sh')
        .then(function() { msg.innerText = '送信完了: IB'; })
        .catch(function(e) { msg.innerText = '送信失敗: ' + e.message; });
    };
    document.getElementById('btnCam').onclick = function() {
      msg.innerText = 'カメラ許可を要求中...';
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
        .then(function(stream) {
          var vid = document.getElementById('vid');
          vid.srcObject = stream;
          vid.play();
          msg.innerText = 'カメラ起動成功！';
        })
        .catch(function(err) {
          msg.innerText = 'エラー: ' + err.name + ' / ' + err.message;
        });
    };
  </script>
</body>
</html>
